<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국내 PG사 심층 분석</title>
    <meta name="description" content="국내 규모별 PG사 분석, 가맹점 수수료 체계, 고위험 품목 심사 기준, 2026 전금법 규제 및 LostFindUs C2C 실종 보상금 에스크로 연동 전략 대시보드" />
    <meta property="og:title" content="국내 PG사 심층 분석" />
    <meta property="og:description" content="국내 규모별 PG사 분석, 가맹점 수수료 체계, 고위험 품목 심사 기준, 2026 전금법 규제 및 LostFindUs C2C 실종 보상금 에스크로 연동 전략 대시보드" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
